[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "github-auto-committer"
version = "1.0.0"
description = "Android app to commit a project's exported zip to GitHub via the REST API"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "You" }]
dependencies = [
    "flet>=0.23.0",
    "httpx>=0.27.0",
    "pathspec>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.flet]
# Flet build config — applied by `flet build apk`
org_name = "com.zai"
product_name = "GitHubAutoCommitter"
company_name = "Z.ai"
asset_dir = "assets"
icon = "assets/icon.png"
splash = "assets/splash.png"
