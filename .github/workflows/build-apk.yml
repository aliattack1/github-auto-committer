name: Build Android APK

# Triggers:
#   - Manual dispatch via the Actions UI
#   - On pushing a git tag like `v1.0.0` (also creates a GitHub Release)
#   - On push to main/master (so the APK rebuilds as you change code)
#   - On PRs to main/master
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# Cancel any in-flight run when a new commit lands on the same ref
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        # The ubuntu-22.04 runner ships the Android SDK but not all
        # licenses are accepted, which breaks Gradle. Accept them all.
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "Android SDK licenses accepted"

      - name: Wipe malformed NDK
        # The runner image ships a pre-installed NDK at
        # /usr/local/lib/android/sdk/ndk/28.2.13676358 that Flutter
        # reports as a malformed download. Deleting it lets the Android
        # Gradle Plugin re-download a clean copy during assembleRelease.
        # We wipe ALL NDK versions to be safe — Gradle reinstalls what it needs.
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$ANDROID_HOME/ndk" ]; then
            echo "Existing NDK versions:"
            ls -1 "$ANDROID_HOME/ndk" || true
            rm -rf "$ANDROID_HOME/ndk"/*
            echo "NDK directory wiped — Gradle will re-download"
          else
            echo "No NDK directory present — nothing to wipe"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli

      - name: Show Flet version
        run: flet --version

      - name: Install project Python deps
        run: pip install -r requirements.txt

      - name: Pre-fetch serious_python (will fail at pip step — expected)
        run: flet build apk --verbose --yes || true

      - name: Patch serious_python mobilePyPiUrl (add trailing slash)
        run: |
          set -e
          file=$(find "$HOME/.pub-cache" -path "*serious_python-*/bin/package_command.dart" | head -1)
          if [ -z "$file" ]; then
            echo "ERROR: serious_python source not found in pub cache"
            exit 1
          fi
          echo "Patching $file"
          sed -i 's|const mobilePyPiUrl = "https://pypi.flet.dev";|const mobilePyPiUrl = "https://pypi.flet.dev/";|' "$file"
          echo "After patch:"
          grep -n mobilePyPiUrl "$file"

      - name: Build APK (with patched serious_python)
        run: flet build apk --verbose --yes

      - name: Locate APK
        run: |
          echo "=== APK files ==="
          find build -name "*.apk" -exec ls -lh {} \;
          APK_PATH=$(find build -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: no APK found in build/"
            exit 1
          fi
          echo "First APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
        id: locate

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-auto-committer-apk
          path: build/flutter/build/app/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/flutter/build/app/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug — show build tree (on failure)
        if: failure()
        run: |
          echo "=== build/ dirs ==="
          find build -maxdepth 6 -type d 2>/dev/null | head -40 || true
          echo "=== all .apk files ==="
          find . -name "*.apk" 2>/dev/null || true
