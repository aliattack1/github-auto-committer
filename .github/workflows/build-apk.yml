name: Build Android APK

# Triggers:
#   - Manual dispatch via the Actions UI
#   - On pushing a git tag like `v1.0.0` (release-style)
#   - On push to main/master (so the APK rebuilds as you change code)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          # Target: Android APK (debug build is fine for sideloading)
          target: apk
          # Python that runs the Flet CLI on the runner
          runner-python-version: "3.12"
          # Python that gets bundled into the APK itself
          bundled-python-version: "3.12"
          # Incrementing build id from GitHub's run counter
          build-number: ${{ github.run_number }}
          # Pass --debug for a debug-signed APK that's easy to sideload.
          # Drop this for a release build (requires signing keys configured).
          extra-args: "--debug"

      - name: Locate built APK
        id: find_apk
        run: |
          set -e
          # The action's archive-path output is a .tar.gz of the build dir
          # when archive-output is enabled (default). For APK it actually
          # outputs the apk + checksum files. We also support the raw
          # output-path for the case where archive-output was disabled.
          echo "archive-path = ${{ steps.build.outputs.archive-path }}"
          echo "output-path  = ${{ steps.build.outputs.output-path }}"

          # Find any .apk under either output location
          APK_PATH=""
          for search_dir in "${{ steps.build.outputs.output-path }}" "$(dirname ${{ steps.build.outputs.archive-path }})"; do
            if [ -d "$search_dir" ]; then
              APK_PATH=$(find "$search_dir" -name "*.apk" -type f 2>/dev/null | head -1)
            fi
            [ -n "$APK_PATH" ] && break
          done

          # Fallback: search whole repo
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          fi

          if [ -z "$APK_PATH" ]; then
            echo "No APK found anywhere in the workspace"; exit 1
          fi
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-auto-committer-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
